services:
  postgres:
    image: postgres:16-alpine
    container_name: seapedia-db
    environment:
      POSTGRES_USER: seapedia
      POSTGRES_PASSWORD: seapedia
      POSTGRES_DB: seapedia
    ports:
      - '5432:5432'
    volumes:
      - seapedia-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seapedia']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seapedia-redis
    ports:
      - '6379:6379'
    volumes:
      - seapedia-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  seapedia-pgdata:
  seapedia-redis-data:
